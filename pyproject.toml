[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chattoon"
version = "3.0.1"
description = "Virtual 3D co-host for live streams on YouTube, Twitch, Kick, TikTok and more at the same time, powered by local AI (Ollama) and TTS BigLinux."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["PySide6>=6.6", "aiohttp>=3.9"]

[project.optional-dependencies]
test = ["pytest>=8"]
# Kick official webhooks: RSA signature check
kick-webhook = ["cryptography>=41"]
# Logins in the system keyring (Secret Service); without it a private 0600 file is used
keyring = ["PyGObject>=3.42"]
# TikTok LIVE (unofficial, modified AGPL-3.0, uses the Euler Stream signing service):
# install with `chattoon extras install tiktok` (private venv), not system-wide
tiktok = ["TikTokLive==7.0.1"]

[project.scripts]
chattoon = "chattoon.cli:main"

[tool.setuptools.packages.find]
include = ["chattoon*"]

[tool.setuptools.package-data]
chattoon = ["gui/qml/*.qml", "gui/qml/pages/*.qml", "gui/qml/qmldir", "gui/qml/assets/*", "gui/qml/assets/characters/*",
            "i18n/*.qm",
            "web/overlay/*", "web/overlay/characters/*", "web/vendor/three/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
